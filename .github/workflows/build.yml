name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Sender (Master)
      run: |
        . /opt/esp/idf/export.sh
        cd sender
        idf.py build

    - name: Build Receiver (Slave)
      run: |
        . /opt/esp/idf/export.sh
        cd receiver
        idf.py build

    - name: Upload Binaries Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-firmware-binaries
        path: |
          sender/build/*.bin
          sender/build/bootloader/*.bin
          sender/build/partition_table/*.bin
          receiver/build/*.bin
          receiver/build/bootloader/*.bin
          receiver/build/partition_table/*.bin
